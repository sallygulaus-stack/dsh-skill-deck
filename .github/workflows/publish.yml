name: publish

# 发布走 GitHub Actions + npm Trusted Publishing（OIDC）：
# GitHub 用仓库身份直接向 npm 换取一次性发布凭证，本地不需要任何 npm 令牌，也不需要 2FA。
# 推 tag（v0.1.2 这种）即触发；workflow_dispatch 留给手动重试。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Trusted Publishing 必须有 id-token: write，否则拿不到 OIDC token。
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 确保 npm 支持 Trusted Publishing（需要 >= 11.5.1）
        run: |
          npm install -g npm@^11
          node -v
          npm -v

      - name: 冒烟测试（宿主 / 宿主路由 / 客户端）
        run: |
          node scripts/smoke-host.js
          node scripts/smoke-host-routes.js
          node scripts/smoke-client.js

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG / tag = $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致，拒绝发布"
            exit 1
          fi

      - name: 发布到 npm（OIDC 换取凭证，无令牌）
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org/
